name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 lxml scikit-learn \
                      plotly folium sqlalchemy python-dotenv pytest mlflow joblib

      - name: Run tests
        run: pytest tests/ -v --tb=short
